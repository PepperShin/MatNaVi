<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 추가된 meta 태그: description, keywords -->

      name="description"
      content="여행 정보를 제공하는 MatNaVi 애플리케이션입니다. 다양한 관광지 정보와 날씨, 지도 서비스를 확인하세요."
    />
    <meta name="keywords" content="여행, 관광, 지도, 날씨, MatNaVi" />
